name: rollback

# Manual rollback. Open Actions → Rollback → Run workflow.
# Pick the image tag (short git SHA) you want to redeploy. Run `git log --oneline`
# locally to find it, or look at the Actions history for previous deploy runs.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (12-char short SHA from a previous build)"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy chosen tag on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/makerbooking
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./scripts/deploy.sh ${{ inputs.image_tag }}
