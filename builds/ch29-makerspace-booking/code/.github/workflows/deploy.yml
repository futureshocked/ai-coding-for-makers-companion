name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: makerbooking

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build_and_deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          SEM_VER=$(cat VERSION)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${SEM_VER}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Caddy image (with cloudflare DNS module)
        uses: docker/build-push-action@v5
        with:
          context: caddy/
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.owner_lc }}/makerbooking-caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Sync compose + caddy + scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,caddy/Caddyfile,scripts/deploy.sh,scripts/backup.sh"
          target: /opt/makerbooking/
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/makerbooking
            chmod +x scripts/deploy.sh scripts/backup.sh
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./scripts/deploy.sh ${{ steps.tag.outputs.tag }}
