# Used on the VPS at /opt/makerbooking/docker-compose.yml.
# The IMAGE_TAG variable is exported by scripts/deploy.sh before `docker compose up`.
# All sensitive values come from /opt/makerbooking/.env (mode 600, never in git).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    image: ghcr.io/${GHCR_OWNER}/makerbooking:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      FLASK_CONFIG: production
      RUN_SCHEDULER: "0"
    volumes:
      - ./data/uploads:/app/app/static/uploads/resources
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  scheduler:
    image: ghcr.io/${GHCR_OWNER}/makerbooking:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      FLASK_CONFIG: production
      RUN_SCHEDULER: "0"
    command: ["python", "-m", "app.scheduler"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: ghcr.io/${GHCR_OWNER}/makerbooking-caddy:latest
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
