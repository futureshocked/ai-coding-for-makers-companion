{% extends "base.html" %}
{% block title %}Set New Password — Makerspace Booking{% endblock %}

{% block content %}
<div style="text-align:center;margin-bottom:1.5rem">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round"
       style="color:var(--text-3);display:block;margin:0 auto .75rem" aria-hidden="true">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
</div>
<h1>Set a new password</h1>
<form method="post">
  <label for="password">
    New password
    <span style="font-weight:400;color:var(--text-3);font-size:.8rem">(min 10 characters)</span>
  </label>
  <input type="password" id="password" name="password" required autofocus autocomplete="new-password">

  <label for="password2">Confirm new password</label>
  <input type="password" id="password2" name="password2" required autocomplete="new-password"
         oninput="this.setCustomValidity(this.value !== document.getElementById('password').value ? 'Passwords do not match.' : '')">

  <button type="submit">Update password</button>
</form>
<div class="links">
  <a href="{{ url_for('auth.login') }}">← Back to log in</a>
</div>
{% endblock %}
