{% extends "base.html" %}
{% block title %}Forgot Password — Makerspace Booking{% endblock %}

{% block content %}
<div style="text-align:center;margin-bottom:1.5rem">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round"
       style="color:var(--text-3);display:block;margin:0 auto .75rem" aria-hidden="true">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  </svg>
</div>
<h1>Reset your password</h1>
<p style="color:var(--text-2);margin-bottom:.25rem;font-size:.9rem">
  Enter your email address and we'll send you a reset link.
</p>
<form method="post">
  <label for="email">Email address</label>
  <input type="email" id="email" name="email" required autofocus autocomplete="email">

  <button type="submit">Send reset link</button>
</form>
<div class="links">
  <a href="{{ url_for('auth.login') }}">← Back to log in</a>
</div>
{% endblock %}
