{% extends "base.html" %}
{% block title %}Reset Password — MakerBooking{% endblock %}

{% block content %}
<div style="text-align:center;margin-bottom:1.5rem">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round"
       style="color:var(--text-3);display:block;margin:0 auto .75rem" aria-hidden="true">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
</div>
<h1>Reset your password</h1>
{% if tenant_name %}
<p style="color:var(--text-2);font-size:.9rem;margin-bottom:.25rem">
  Resetting password for <strong>{{ tenant_name }}</strong>.
</p>
{% endif %}
<form method="post">
  <label for="password">New password
    <span style="font-weight:400;color:var(--text-3);font-size:.8rem">(min 10 characters)</span>
  </label>
  <input type="password" id="password" name="password"
         minlength="10" required autofocus autocomplete="new-password">

  <label for="password2">Confirm new password</label>
  <input type="password" id="password2" name="password2"
         minlength="10" required autocomplete="new-password">

  <input type="hidden" name="token" value="{{ token }}">
  <button type="submit">Update password</button>
</form>
{% endblock %}
